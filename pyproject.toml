[project]
name = "trade-jev"
version = "0.1.0"
license = "MIT"
description = "Backtest Jev (TypeSafe) as a BUY/SELL/HOLD trader on NQ L10 order-book data"
authors = [
    { name = "Justin He", email = "justinhe16@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "databento>=0.87.0",
    "ib_async>=2.1.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
# databento pulls in pip-system-certs on Windows; it patches `ssl` at startup and every Jev call then
# fails with RecursionError inside the SDK's truststore context. Never install it.
override-dependencies = ["pip-system-certs; sys_platform == 'never'"]
